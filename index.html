<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tải tài liệu Word</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 350px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
        }
        input[type="file"] {
            width: 100%;
            margin: 15px 0;
        }
        .info {
            font-size: 14px;
            color: #333;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Tải lên file Word</h2>

    <input 
        type="file" 
        id="wordFile" 
        accept=".doc,.docx"
    >

    <div class="info" id="fileInfo"></div>
</div>

<script>
    const input = document.getElementById("wordFile");
    const info = document.getElementById("fileInfo");

    input.addEventListener("change", function () {
        if (this.files.length === 0) return;

        const file = this.files[0];
        const sizeKB = (file.size / 1024).toFixed(2);

        info.innerHTML = `
            <strong>Tên file:</strong> ${file.name}<br>
            <strong>Dung lượng:</strong> ${sizeKB} KB
        `;
    });
</script>

</body>
</html>
